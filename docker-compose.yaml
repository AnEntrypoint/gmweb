x-bake:
  targets:
    gmweb:
      platforms:
        - linux/amd64
        - linux/arm64

services:
  gmweb:
    build:
      context: .
      dockerfile: Dockerfile
    image: almagest/gmweb:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - PASSWORD=${PASSWORD:-password}
      - FILE_MANAGER_PATH=/config/Desktop
      # Host's public IP, advertised in WebRTC host candidates. Required behind 1:1 NAT.
      # Left blank, the container autodetects it at boot (see svc-selkies/run).
      - SELKIES_WEBRTC_PUBLIC_IP=${SELKIES_WEBRTC_PUBLIC_IP:-}
      # Optional WebRTC relay for an edge firewall that forwards no inbound UDP: set the
      # Cloudflare TURN key and both sides reach the relay outbound, so no firewall change
      # is needed. svc-selkies/run turns ICE-lite off whenever these are set, because an
      # ICE-lite agent offers host candidates only and never gathers the relay.
      - SELKIES_ENABLE_CLOUDFLARE_TURN=${SELKIES_ENABLE_CLOUDFLARE_TURN:-}
      - SELKIES_CLOUDFLARE_TURN_TOKEN_ID=${SELKIES_CLOUDFLARE_TURN_TOKEN_ID:-}
      - SELKIES_CLOUDFLARE_TURN_API_TOKEN=${SELKIES_CLOUDFLARE_TURN_API_TOKEN:-}
    # WebRTC media is UDP and does not traverse the HTTP proxy, so the mux port is published
    # directly. The edge firewall forwards no rule for it and does not need one: full ICE
    # makes the server send from 59000 first, and the firewall's port-preserving mapping then
    # admits the client's traffic. A forwarding rule would only make the first packet arrive
    # sooner, and the deployment falls back to WebSockets over the proxied HTTPS port.
    ports:
      - "59000:59000/udp"
    volumes:
      - gmweb-config:/config
      - gmweb-local:/usr/local
    shm_size: "1gb"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.services.gmweb.loadbalancer.server.port=80
      - traefik.http.services.gmweb.loadbalancer.serversTransport=gmweb-h1@file

volumes:
  gmweb-config:
    driver: local
  gmweb-local:
    driver: local
