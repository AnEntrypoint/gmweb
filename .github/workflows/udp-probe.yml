name: UDP reachability probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import os, socket, struct, time

          # Control: prove this runner can send UDP and receive a reply.
          tid = os.urandom(12)
          req = struct.pack('>HHI', 0x0001, 0, 0x2112A442) + tid
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.settimeout(6)
          try:
              s.sendto(req, ('stun.l.google.com', 19302))
              data, addr = s.recvfrom(2048)
              print(f"CONTROL ok: STUN reply from {addr} ({len(data)} bytes)")
          except Exception as e:
              print(f"CONTROL FAILED: runner cannot use UDP: {e}")

          # Probe the gmweb host's advertised WebRTC mux port.
          u = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          for i in range(10):
              u.sendto(b'gmweb-udp-probe-%d' % i, ('169.1.28.36', 59000))
              time.sleep(0.3)
          print("sent 10 datagrams to 169.1.28.36:59000")
          PY
